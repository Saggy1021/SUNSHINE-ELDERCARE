name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/admin-portal-repairs]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run unit and payment settlement tests
        run: pnpm run test:unit
